<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log in</title>
    <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body>
    <header>
        <h1>Pilates Princesses Food Delivery Application</h1>
    </header>
    <main>
        <h2>Log in</h2>
        <form id="login-form">
            <label for="login-email">Email:</label>
            <input type="email" id="login-email" name="email" required>
            <label for="login-password">Password:</label>
            <input type="password" id="login-password" name="password" required>
            <button type="submit">Log in</button>
        </form>

        <h2>Create an account</h2>
        <form id="register-form">
            <label for="reg-email">Email:</label>
            <input type="email" id="reg-email" name="email" required>
            <label for="reg-password">Password (at least 8 characters):</label>
            <input type="password" id="reg-password" name="password" minlength="8" required>
            <label for="reg-role">I am a:</label>
            <select id="reg-role" name="role">
                <option value="customer">Customer</option>
                <option value="owner">Restaurant owner</option>
            </select>
            <button type="submit">Sign up</button>
        </form>

        <div id="result"></div>
    </main>
    <script src="/static/js/auth.js"></script>
    <script src="/static/js/login.js"></script>
</body>
</html>
