<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name = "viewport" content="width = device-width, initial-scale=1.0">
    <title>Update Restaurant</title>
    <link rel = "stylesheet" href="/static/css/styles.css">
</head>
<body>
    <header>
        <h1>Update a Restaurant</h1>
        <nav>
            <a href="/">Home</a> |
            <a href = "/restaurants">Restaurants</a> |
        </nav>
    </header>
    <main>
        <div id="restaurant-details"></div>
        <form id = "update-restaurant-form">
            <label for="name">Restaurant Name:</label>
            <input type="text" id = "name" name="name" required>
            <label for = "address">Address:</label>
            <input type="text" id = "address" name="address" required>
            <label for = "cuisine">Cuisine:</label>
            <input type="text" id = "cuisine" name="cuisine" required>
            <button type="submit">Save Changes</button>
            <a id="cancel-link" href="/restaurants">Cancel</a>
        </form>
        <div id="result"></div>
        <section>
            <h2>Menu Items</h2>
            <div id="menu-item-editor"></div>
            <h3>Add a Menu Item</h3>
            <form id="create-menu-item-form">
                <label for="new-name">Name</label>
                <input type="text" id="new-name" name="name" required>
                <label for="new-desc">Description</label>
                <input type="text" id="new-desc" name="description">
                <label for="new-price">Price</label>
                <input type="number" id="new-price" name="price" step="0.01" min="0.01" required>
                <button type="submit">Add Item</button>
            </form>
            <div id = "menu-item-result"></div>
        </section>
    </main>
    <script src="/static/js/restaurant-details.js"></script>
    <script src="/static/js/update-restaurant.js"></script>
    <script src="/static/js/menu-items.js"></script>
</body>
</html>
